services:
  app:
    build: .
    container_name: paycomply-app
    ports:
      - "8080:8000"
    environment:
      APP_NAME: "PayComply"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: paycomply
      DB_USERNAME: paycomply
      DB_PASSWORD: secret
      MODULE_JURISDICTIONS: "true"
      MODULE_WAGE_CLASSES: "true"
      MODULE_OVERTIME_RULES: "true"
      MODULE_EMPLOYEES: "true"
      MODULE_PAY_PERIODS: "true"
      MODULE_FILINGS: "true"
      MODULE_ALERTS: "true"
      MODULE_PDF_PACKS: "true"
      MODULE_AI_ASSIST: "true"
      MODULE_CATALOG_SCRAPE: "false"
      MODULE_ATTENDANCE_OPS: "false"
      MODULE_SPEED_OPTIMIZER: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.4
    container_name: paycomply-mysql
    environment:
      MYSQL_DATABASE: paycomply
      MYSQL_USER: paycomply
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - paycomply_mysql:/var/lib/mysql

volumes:
  paycomply_mysql:
